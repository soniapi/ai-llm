[package]
name = "ai-llm-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
google-cloud-auth = { version = "0.13.0", default-features = false, features = ["rustls-tls"] }
google-cloud-token = "0.1.2"
prost = "0.13.5"
reqwest = { version = "0.13.2", features = ["json"] }
rustls = { version = "0.23.39", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "process"] }
tonic = { version = "0.12.3", features = ["tls-roots"] }

[build-dependencies]
tonic-build = "0.12.3"

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
